name: Swift harness timing comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        variant: [synchronization-final]
        trial: [1, 2, 3]
        include:
          - variant: synchronization-final
            ref: 9eeff62d1ae0a813ea1417d753279fca6d9d70e8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n1)"
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Measure the unchanged suite on a fresh VM
        env:
          VARIANT: ${{ matrix.variant }}
          TRIAL: ${{ matrix.trial }}
        run: python3 .github/scripts/measure-harness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.variant }}-${{ matrix.trial }}
          path: measurements/
          retention-days: 14
          if-no-files-found: error
